<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; base-uri 'self'; object-src 'none'" />
  <title>QR Code Generator | Earl Peatross III</title>
  <meta name="description" content="Generate and download a printable QR code for your networking page." />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="assets/qr-page.css" />
</head>
<body>
  <main class="qr-tool container">
    <a class="back-link" href="index.html">← Back to site</a>
    <h1>QR Code Generator</h1>
    <p class="section-sub">Create a crisp, printable QR code that links to your site. Everything runs in your browser; nothing is uploaded.</p>

    <div class="qr-tool-grid">
      <form class="qr-form" id="qr-form" autocomplete="off">
        <label for="qr-text">Destination URL</label>
        <input type="text" id="qr-text" name="qr-text" value="https://YOUR-DOMAIN-HERE.com" inputmode="url" />

        <label for="qr-ecl">Error correction</label>
        <select id="qr-ecl" name="qr-ecl">
          <option value="L">L · Low (~7%)</option>
          <option value="M" selected>M · Medium (~15%)</option>
          <option value="Q">Q · Quartile (~25%)</option>
          <option value="H">H · High (~30%, most robust)</option>
        </select>

        <label for="qr-size">Download size (px)</label>
        <input type="number" id="qr-size" name="qr-size" value="1024" min="128" max="4096" step="64" />

        <button type="submit" class="btn btn-accent">Generate</button>
      </form>

      <div class="qr-preview">
        <div class="qr-code" id="qr-code" role="img" aria-label="Generated QR code"></div>
        <div class="qr-tool-actions">
          <button type="button" class="btn btn-primary" id="download-png">Download PNG</button>
          <button type="button" class="btn btn-ghost" id="download-svg">Download SVG</button>
          <button type="button" class="btn btn-ghost" id="print-qr">Print</button>
        </div>
        <p class="qr-tip">Tip: for business cards, level <strong>Q</strong> or <strong>H</strong> tolerates scuffs and ink bleed better.</p>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
  <script src="assets/qr-page.js"></script>
</body>
</html>
